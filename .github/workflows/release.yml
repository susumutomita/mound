name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release-build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
          - runner: macos-13
            platform: macos-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: ubuntu-latest
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Resolve version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: make install-ci

      - name: Build ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          BUN_BIN=$(command -v bun)
          bash scripts/build-dist.sh "$PLATFORM" "$BUN_BIN" dist
          cd dist
          tar -czf "mound-$VERSION-$PLATFORM.tar.gz" "mound-$PLATFORM"
          rm -rf "mound-$PLATFORM"
          shasum -a 256 "mound-$VERSION-$PLATFORM.tar.gz" \
            > "mound-$VERSION-$PLATFORM.tar.gz.sha256"

      - name: Self smoke (isolation)
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tmp=$(mktemp -d)
          tar -xzf "dist/mound-$VERSION-$PLATFORM.tar.gz" -C "$tmp"
          "$tmp/mound-$PLATFORM/bin/mound" --version
          "$tmp/mound-$PLATFORM/bin/mound" --help | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: mound-${{ matrix.platform }}
          path: dist/*
          retention-days: 7

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: release-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums.txt
        working-directory: dist
        run: |
          cat *.sha256 > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: Generate Homebrew formula
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          bash scripts/generate-formula.sh "$VERSION" "$REPO" dist > dist/mound.rb
          echo "--- generated formula ---"
          cat dist/mound.rb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
            dist/mound.rb
